# Keep workspace selection inside the application on every host platform.
- id: directory-picker
  disabled: true
- insert:
    - id: graph-collaboration
      name: '@dopame/dsh-graph-collaboration'
    - id: dopame-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: dopame-directory-picker-ui
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
    # Reuse the official bridge inside each Agent's own scope and workspace.
    - id: dopame-acde-mcp
      name: '@dopame/dsh-acde-mcp'
      config:
        command: !!js process.env.DOPAME_ACDE_COMMAND
        env: !!js 'JSON.parse(process.env.DOPAME_ACDE_ENV)'
